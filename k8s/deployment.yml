apiVersion: apps/v1
kind: Deployment
metadata:
  name: shape-free-website
  labels:
    app: shape-free-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shape-free-website
  template:
    metadata:
      labels:
        app: shape-free-website
    spec:
      containers:
      - name: shape-free-website
        image: ajilash25/sshape-free-website:10
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
